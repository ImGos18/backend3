paths:
  /api/orders:
    get:
      summary: Obtener todos los pedidos
      description: Endpoint para obtener todos los pedidos registrados en la base de datos.
      tags:
        - Orders
      responses:
        "200":
          description: Lista de pedidos obtenida correctamente.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/successResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Order"
    post:
      summary: Crear un nuevo pedido
      tags:
        - Orders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Order"
      responses:
        "201":
          description: Pedido creado correctamente.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/successResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Order"

        "400":
          description: Datos inválidos o campos obligatorios faltantes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "500":
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/orders/{id}:
    get:
      summary: Obtener un pedido por ID
      description: Endpoint para obtener un pedido específico utilizando su ID.
      tags:
        - Orders
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: ID del pedido a obtener
      responses:
        "200":
          description: Pedido obtenido correctamente.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/successResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Order"
        "400":
          description: El id ingresado no es valido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                error: INVALID_OBJECT_ID
                message: "El id ingresado no es valido"

        "404":
          description: No se encontro el pedido solicitado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                error: ORDER_NOT_FOUND
                message: "No se encontro el pedido solicitado"

        "500":
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                error: INTERNAL_SERVER_ERROR
                message: "Ocurrio un error interno en el servidor "

  /api/orders/{id}/status:
    patch:
      summary: Actualizar el estado de un pedido
      tags:
        - Orders
      parameters:
        - name: id
          in: path
          required: true
          description: ID del pedido que se actualizará.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum:
                    - pending
                    - in_transit
                    - delivered
                  example: in_transit
      responses:
        "200":
          description: Estado del pedido actualizado correctamente.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/successResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Order"

        "400":
          description: ID inválido, estado inválido o campos faltantes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                IdInvalido:
                  value:
                    status: error
                    error: INVALID_OBJECT_ID
                    message: "El id ingresado no es valido"
                EstadoInvalido:
                  value:
                    status: error
                    error: INVALID_ORDER_STATUS
                    message: "El estado indicado no es valido para un pedido"
                EstadoFaltante:
                  value:
                    status: error
                    error: MISSING_REQUIRED_FIELDS
                    message: "faltan los siguientes campos: status"

        "404":
          description: No se encontro el pedido solicitado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                error: ORDER_NOT_FOUND
                message: "No se encontro el pedido solicitado"

        "500":
          description: Error interno del servidor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                error: INTERNAL_SERVER_ERROR
                message: "Ocurrio un error interno en el servidor "
