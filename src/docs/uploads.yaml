paths:
  /api/users/{id}/documents:
    post:
      summary: Subir un documento de usuario
      description: Guarda el archivo en uploads/documents y registra sus metadatos en el usuario.
      tags:
        - Uploads
      parameters:
        - in: path
          name: id
          required: true
          description: ID de MongoDB del usuario.
          schema:
            type: string
            example: 665f4d0a8f9a1b001234abcd
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - document
                - type
              properties:
                document:
                  type: string
                  format: binary
                  description: PDF, JPEG, PNG, WEBP o TXT de hasta 5MB.
                type:
                  type: string
                  enum:
                    - user_document
      responses:
        "200":
          description: Documento asociado correctamente.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/successResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/User"
        "400":
          description: Archivo faltante, campo incorrecto, MIME o tipo documental invalido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Usuario no encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: El archivo supera el maximo de 5MB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error al almacenar el archivo o sus metadatos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

