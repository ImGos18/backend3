paths:
  /api/mocks/Users:
    get:
      summary: Generar usuarios mockeados
      description: Endpoint para generar usuarios mockeados sin guardar en la base de datos.
      tags:
        - Mocks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - mockResults
              properties:
                mockResults:
                  type: integer
                  example: 1
      responses:
        "201":
          description: Lista de usuarios mockeada generada correctamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/successResponse"

                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/User"
        "400":
          description: Error en la solicitud
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                - status: error
                  error: 400
                  message: "debes enviar mockResults con el numero de resultados esperado"
    post:
      summary: Crear usuarios mockeados
      description: Endpoint para crear usuarios mockeados y guardarlos en la base de datos.
      tags:
        - Mocks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - mockResults
              properties:
                mockResults:
                  type: integer
                  example: 1
      responses:
        "201":
          description: Lista de usuarios mockeada generada correctamente
